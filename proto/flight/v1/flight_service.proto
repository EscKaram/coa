// Контракт Flight Service: рейсы и места на них.
//
// Аутентификация: каждый вызов FlightService несёт metadata "x-api-key".
// Нет ключа или ключ неверный -> UNAUTHENTICATED.
//
// Бизнес-ошибки возвращаются стандартными кодами gRPC. В деталях статуса
// (grpc-status-details-bin, google.rpc.Status) лежит google.rpc.ErrorInfo:
//   domain   = "flight.v1"
//   reason   = имя значения ErrorReason
//   metadata = контекст ошибки (например, requested/available для NOT_ENOUGH_SEATS).
syntax = "proto3";

package flight.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";

service FlightService {
  // Рейсы в статусе SCHEDULED по маршруту и, опционально, дате вылета (UTC),
  // по возрастанию времени вылета. Без даты возвращается не больше 100 рейсов.
  //   INVALID_ARGUMENT  origin/destination не IATA-код из 3 букв, origin == destination,
  //                     некорректная дата (INVALID_ARGUMENT).
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);

  // Рейс по ID в любом статусе.
  //   INVALID_ARGUMENT  flight_id не UUID (INVALID_ARGUMENT).
  //   NOT_FOUND         рейса нет (FLIGHT_NOT_FOUND).
  rpc GetFlight(GetFlightRequest) returns (GetFlightResponse);

  // Атомарно уменьшает available_seats рейса и создаёт SeatReservation в статусе ACTIVE.
  // Идемпотентен по booking_id: повтор с теми же flight_id и seat_count возвращает уже
  // созданную резервацию (replayed = true) и места повторно не списывает.
  //   INVALID_ARGUMENT     flight_id/booking_id не UUID, seat_count < 1,
  //                        некорректная expected_price (INVALID_ARGUMENT).
  //   NOT_FOUND            рейса нет (FLIGHT_NOT_FOUND).
  //   FAILED_PRECONDITION  рейс не SCHEDULED или уже вылетел (FLIGHT_NOT_BOOKABLE);
  //                        резервация этого booking_id уже снята (RESERVATION_NOT_ACTIVE).
  //   RESOURCE_EXHAUSTED   свободных мест меньше seat_count (NOT_ENOUGH_SEATS).
  //   ABORTED              текущая цена отличается от expected_price (PRICE_CHANGED).
  //   ALREADY_EXISTS       booking_id уже использован с другим рейсом или числом мест
  //                        (BOOKING_ID_CONFLICT).
  rpc ReserveSeats(ReserveSeatsRequest) returns (ReserveSeatsResponse);

  // Находит резервацию бронирования, возвращает места на рейс, ставит статус RELEASED.
  // Идемпотентен: для уже RELEASED резервации возвращает её же (replayed = true).
  //   INVALID_ARGUMENT     booking_id не UUID (INVALID_ARGUMENT).
  //   NOT_FOUND            резервации нет (RESERVATION_NOT_FOUND).
  //   FAILED_PRECONDITION  рейс уже DEPARTED/COMPLETED (FLIGHT_ALREADY_DEPARTED);
  //                        резервация EXPIRED (RESERVATION_NOT_ACTIVE).
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);

  // Операционное изменение рейса: статус, расписание, цена. Меняются только переданные поля.
  //   INVALID_ARGUMENT     нет ни одного поля, arrival_time <= departure_time, цена <= 0,
  //                        больше двух знаков после запятой или другая валюта (INVALID_ARGUMENT).
  //   NOT_FOUND            рейса нет (FLIGHT_NOT_FOUND).
  //   FAILED_PRECONDITION  недопустимый переход статуса; перенос или смена цены
  //                        не SCHEDULED рейса (INVALID_STATUS_TRANSITION, FLIGHT_NOT_BOOKABLE).
  //   ALREADY_EXISTS       после переноса совпали номер рейса и дата вылета (FLIGHT_ALREADY_EXISTS).
  rpc UpdateFlight(UpdateFlightRequest) returns (UpdateFlightResponse);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

// Значения google.rpc.ErrorInfo.reason. Сами по себе в сообщениях не передаются.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  FLIGHT_NOT_FOUND = 2;
  FLIGHT_NOT_BOOKABLE = 3;
  NOT_ENOUGH_SEATS = 4;
  PRICE_CHANGED = 5;
  BOOKING_ID_CONFLICT = 6;
  RESERVATION_NOT_FOUND = 7;
  RESERVATION_NOT_ACTIVE = 8;
  FLIGHT_ALREADY_DEPARTED = 9;
  INVALID_STATUS_TRANSITION = 10;
  FLIGHT_ALREADY_EXISTS = 11;
}

message Airline {
  string iata_code = 1;  // "SU"
  string name = 2;
}

message Airport {
  string iata_code = 1;  // "SVO"
  string name = 2;
  string city = 3;
}

message Flight {
  string id = 1;                                  // UUID
  string flight_number = 2;                       // код авиакомпании + номер: "SU1234"
  Airline airline = 3;
  Airport origin = 4;
  Airport destination = 5;
  google.protobuf.Timestamp departure_time = 6;
  google.protobuf.Timestamp arrival_time = 7;
  int32 total_seats = 8;
  int32 available_seats = 9;
  google.type.Money price = 10;                   // цена одного места, два знака после запятой
  FlightStatus status = 11;
}

message SeatReservation {
  string id = 1;                                  // UUID
  string flight_id = 2;
  string booking_id = 3;                          // ID бронирования в Booking Service
  int32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SearchFlightsRequest {
  string origin = 1;                              // IATA-код, регистр не важен
  string destination = 2;
  google.type.Date departure_date = 3;            // опционально; дата вылета по UTC
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  string flight_id = 1;
}

message GetFlightResponse {
  Flight flight = 1;
}

message ReserveSeatsRequest {
  string flight_id = 1;
  string booking_id = 2;                          // ключ идемпотентности
  int32 seat_count = 3;
  // Опционально: цена места, которую клиент видел в GetFlight. Если цена успела измениться,
  // резервация не создаётся (ABORTED / PRICE_CHANGED), и клиент не зафиксирует устаревшую цену.
  google.type.Money expected_price = 4;
}

message ReserveSeatsResponse {
  SeatReservation reservation = 1;
  bool replayed = 2;                              // true: резервация создана предыдущим вызовом
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message ReleaseReservationResponse {
  SeatReservation reservation = 1;
  bool replayed = 2;                              // true: резервация была снята раньше
}

message UpdateFlightRequest {
  string flight_id = 1;
  optional FlightStatus status = 2;
  google.protobuf.Timestamp departure_time = 3;
  google.protobuf.Timestamp arrival_time = 4;
  google.type.Money price = 5;
}

message UpdateFlightResponse {
  Flight flight = 1;
}
