openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: |
    API маркетплейса: каталог товаров, заказы, промокоды, аутентификация.

    Все эндпоинты, кроме `/auth/*`, требуют заголовок `Authorization: Bearer <access_token>`.
    Роль пользователя передаётся в claim `role` access-токена.

    | Операция                   | USER        | SELLER      | ADMIN       |
    |----------------------------|-------------|-------------|-------------|
    | `GET /products`            | Все товары  | Все товары  | Все товары  |
    | `GET /products/{id}`       | Любой товар | Любой товар | Любой товар |
    | `POST /products`           | Запрещено   | Только свои | Любые       |
    | `PUT /products/{id}`       | Запрещено   | Только свои | Любые       |
    | `DELETE /products/{id}`    | Запрещено   | Только свои | Любые       |
    | `POST /orders`             | Да          | Запрещено   | Да          |
    | `GET /orders/{id}`         | Только свои | Запрещено   | Любые       |
    | `PUT /orders/{id}`         | Только свои | Запрещено   | Любые       |
    | `POST /orders/{id}/cancel` | Только свои | Запрещено   | Любые       |
    | `POST /orders/{id}/status` | Только свои | Запрещено   | Любые       |
    | `POST /promo-codes`        | Запрещено   | Да          | Да          |

    Все ошибки возвращаются в формате `Error`.

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: products
  - name: orders
  - name: promo-codes
  - name: system

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Проверка работоспособности сервиса
      security: []
      responses:
        '200':
          description: Сервис запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      description: Самостоятельно можно зарегистрироваться с ролью `USER` или `SELLER`. Администратор создаётся при старте сервиса.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация, возвращает access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновление access token по refresh token
      description: Возвращает новую пару токенов. Ошибка — `REFRESH_TOKEN_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products:
    post:
      tags: [products]
      operationId: createProduct
      summary: Создание товара
      description: 'Роли: SELLER (товар привязывается к нему как к продавцу), ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с пагинацией и фильтрацией
      description: 'Роли: USER, SELLER, ADMIN.'
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы, начиная с 0
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: size
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          required: false
          description: Категория, точное совпадение
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [products]
      operationId: getProduct
      summary: Получение товара по ID
      description: 'Роли: USER, SELLER, ADMIN.'
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Обновление товара
      description: 'Роли: SELLER (только свои товары), ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Обновлённый товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Мягкое удаление (перевод в статус ARCHIVED)
      description: 'Роли: SELLER (только свои товары), ADMIN. Запись не удаляется физически.'
      responses:
        '200':
          description: Товар переведён в статус ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создание заказа
      description: |
        Роли: USER, ADMIN.

        Проверки выполняются последовательно: частота создания (`ORDER_LIMIT_EXCEEDED`),
        активные заказы (`ORDER_HAS_ACTIVE`), каталог (`PRODUCT_NOT_FOUND`, `PRODUCT_INACTIVE`),
        остатки (`INSUFFICIENT_STOCK`), промокод (`PROMO_CODE_INVALID`, `PROMO_CODE_MIN_AMOUNT`).
        Резервирование остатков и создание заказа выполняются в одной транзакции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан в статусе CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получение заказа по ID
      description: 'Роли: USER (только свои заказы), ADMIN.'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [orders]
      operationId: updateOrder
      summary: Обновление позиций заказа
      description: |
        Роли: USER (только свои заказы), ADMIN.

        Разрешено только в статусе CREATED. Проверки: владелец (`ORDER_OWNERSHIP_VIOLATION`),
        состояние (`INVALID_STATE_TRANSITION`), частота обновления (`ORDER_LIMIT_EXCEEDED`),
        каталог и остатки новых позиций. Промокод пересчитывается; если он больше не применим,
        скидка снимается. Всё обновление выполняется в одной транзакции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Обновлённый заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отмена заказа
      description: |
        Роли: USER (только свои заказы), ADMIN.

        Разрешена из статусов CREATED и PAYMENT_PENDING. Остатки и использование промокода
        возвращаются в одной транзакции со сменой статуса.
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Переход заказа в следующее состояние
      description: |
        Роли: USER (только свои заказы), ADMIN.

        Допустимые переходы:
        `CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED`,
        `CREATED → CANCELED`, `PAYMENT_PENDING → CANCELED`.
        Переход в CANCELED выполняется так же, как `POST /orders/{id}/cancel`.
        Любой другой переход — `INVALID_STATE_TRANSITION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Заказ в новом состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /promo-codes:
    post:
      tags: [promo-codes]
      operationId: createPromoCode
      summary: Создание промокода
      description: 'Роли: SELLER, ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token. Claims `sub` (ID пользователя), `role` (USER / SELLER / ADMIN), `type` = `access`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR` — некорректные входные данные; в `details.fields` перечислены поля и нарушения.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`TOKEN_INVALID`, `TOKEN_EXPIRED`, `REFRESH_TOKEN_INVALID`, `INVALID_CREDENTIALS`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`ACCESS_DENIED` — у роли нет прав; `ORDER_OWNERSHIP_VIOLATION` — заказ принадлежит другому пользователю.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`PRODUCT_NOT_FOUND`, `ORDER_NOT_FOUND`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '`PRODUCT_INACTIVE`, `ORDER_HAS_ACTIVE`, `INVALID_STATE_TRANSITION`, `INSUFFICIENT_STOCK`, `USER_ALREADY_EXISTS`, `PROMO_CODE_ALREADY_EXISTS`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: '`PROMO_CODE_INVALID`, `PROMO_CODE_MIN_AMOUNT`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '`ORDER_LIMIT_EXCEEDED` — превышен лимит частоты создания / обновления заказа.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorCode:
      type: string
      enum:
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - ORDER_OWNERSHIP_VIOLATION
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - INVALID_CREDENTIALS
        - ACCESS_DENIED
        - USER_ALREADY_EXISTS
        - PROMO_CODE_ALREADY_EXISTS
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INTERNAL_ERROR

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные
      example:
        error_code: INSUFFICIENT_STOCK
        message: Not enough stock for some items
        details:
          items:
            - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              requested: 5
              available: 2

    # ---------- auth ----------

    UserRole:
      type: string
      enum: [USER, SELLER, ADMIN]

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
          pattern: '^[^@\s]+@[^@\s]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        role:
          type: string
          enum: [USER, SELLER]
          default: USER

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int32
          description: Время жизни access token в секундах

    UserResponse:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time

    # ---------- products ----------

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    ProductCreate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          description: Цена, строго больше 0, два знака после запятой
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductUpdate:
      type: object
      description: Полная замена изменяемых полей товара
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductResponse:
      type: object
      required: [id, name, description, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPage:
      type: object
      required: [items, totalElements, page, size, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32

    # ---------- orders ----------

    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]

    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999

    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          nullable: true
          pattern: '^[A-Z0-9_]{4,20}$'

    OrderUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderStatusChange:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        price_at_order:
          type: number
          format: decimal
          description: Цена за единицу на момент заказа

    OrderResponse:
      type: object
      required: [id, user_id, status, promo_code_id, total_amount, discount_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        total_amount:
          type: number
          format: decimal
          description: Итоговая сумма с учётом скидки
        discount_amount:
          type: number
          format: decimal
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------- promo codes ----------

    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, max_uses, valid_from, valid_until]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          description: Процент (для PERCENTAGE, не более 100) или сумма (для FIXED_AMOUNT)
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          default: 0
        max_uses:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true

    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
        min_order_amount:
          type: number
          format: decimal
        max_uses:
          type: integer
          format: int32
        current_uses:
          type: integer
          format: int32
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
