# Шаблон конфигурации Sentinel. Sentinel переписывает свой конфиг, поэтому контейнер
# копирует этот файл в /data и запускается с копией.
port 26379
dir /data

# Узлы адресуются именами контейнеров (стабильны при перезапуске, в отличие от IP).
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Мастер считается упавшим, когда это подтвердили 2 из 3 sentinel (кворум).
sentinel monitor mymaster redis-master 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
